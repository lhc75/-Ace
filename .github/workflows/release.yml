name: Release

# 手动触发（Actions 页面 Run workflow），或推送 v* 标签时自动打包。
# Windows 产物必须在其专属 runner 上构建（Nuitka 无法交叉编译）；
# macOS 产物虽然本机可打，放 CI 里可以与 Windows 同步发版、版本号一致。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: release-win-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    # Nuitka 首次编译后端需要几十分钟，留出余量
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # scripts/build-backend-nuitka.ps1 硬性要求 env\Scripts\python.exe，
      # 脚本本身不会创建虚拟环境，这里提前建好。
      - name: Create project venv (env/)
        run: python -m venv env

      # Nuitka 编译缓存，二次构建可从几十分钟降到几分钟
      - name: Cache Nuitka build cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka
          key: nuitka-${{ runner.os }}-${{ hashFiles('backend/requirements.txt', 'scripts/build-backend-nuitka.ps1') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      - name: Run Windows build script
        run: .\scripts\build-windows.ps1

      # NSIS 安装包 + portable 便携版 + latest.yml（自动更新元数据）
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  build-macos:
    runs-on: macos-latest # Apple Silicon，与 desktop/package.json 的 dmg arm64 目标一致
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Nuitka 编译缓存（macOS 路径），二次构建大幅提速
      - name: Cache Nuitka build cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Nuitka
          key: nuitka-${{ runner.os }}-${{ hashFiles('backend/requirements.txt', 'scripts/build-backend-nuitka.sh') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      # build-macos.sh 会自建 env 虚拟环境、生成 icns 图标，并产出 dmg + zip
      - name: Run macOS build script
        run: ./scripts/build-macos.sh

      # dmg 安装镜像 + zip（自动更新通道用）+ latest-mac.yml
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
          if-no-files-found: error
          retention-days: 14

  # 仅在推送 v* 标签时运行：把两个平台的产物挂到 GitHub Release 上。
  # .yml/.blockmap 一并上传，electron-updater 的 GitHub 通道需要它们。
  publish-release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist/win

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: dist/mac

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/win/* dist/mac/* \
            -R "${{ github.repository }}" \
            --title "$GITHUB_REF_NAME" --generate-notes
