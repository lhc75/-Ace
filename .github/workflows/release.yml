name: Release Windows

# 手动触发（Actions 页面 Run workflow），或推送 v* 标签时自动打包。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: release-win-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    # Nuitka 首次编译后端需要几十分钟，留出余量
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # scripts/build-backend-nuitka.ps1 硬性要求 env\Scripts\python.exe，
      # 脚本本身不会创建虚拟环境，这里提前建好。
      - name: Create project venv (env/)
        run: python -m venv env

      # Nuitka 编译缓存，二次构建可从几十分钟降到几分钟
      - name: Cache Nuitka build cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka
          key: nuitka-${{ runner.os }}-${{ hashFiles('backend/requirements.txt', 'scripts/build-backend-nuitka.ps1') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      - name: Run Windows build script
        run: .\scripts\build-windows.ps1

      # NSIS 安装包 + portable 便携版 + latest.yml（自动更新元数据）
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
