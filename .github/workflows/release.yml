name: Release

# 手动触发（Actions 页面 Run workflow），或推送 v* 标签时自动打包。
# Windows 产物必须在其专属 runner 上构建（Nuitka 无法交叉编译）；
# macOS 产物虽然本机可打，放 CI 里可以与 Windows 同步发版、版本号一致。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: release-win-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    # Nuitka 首次编译后端需要几十分钟，留出余量
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          # Windows 暂留 3.11：3.13 下 Nuitka 生成的 pymupdf C 模块更大，
          # MSVC 编译报 C1002（compiler out of heap space）；且 WSS 断流仅见于 mac 包。
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # scripts/build-backend-nuitka.ps1 硬性要求 env\Scripts\python.exe，
      # 脚本本身不会创建虚拟环境，这里提前建好。
      - name: Create project venv (env/)
        run: python -m venv env

      # Nuitka 编译缓存，二次构建可从几十分钟降到几分钟
      - name: Cache Nuitka build cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka
          key: nuitka-${{ runner.os }}-py3.11-${{ hashFiles('backend/requirements.txt', 'scripts/build-backend-nuitka.ps1') }}
          restore-keys: |
            nuitka-${{ runner.os }}-py3.11-
            nuitka-${{ runner.os }}-

      # 缓存Python虚拟环境，加速依赖安装
      - name: Cache Python virtualenv
        uses: actions/cache@v4
        with:
          path: env
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            venv-${{ runner.os }}-py3.11-
            venv-${{ runner.os }}-

      - name: Run Windows build script
        run: .\scripts\build-windows.ps1

      # NSIS 安装包 + portable 便携版 + latest.yml（自动更新元数据）
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  build-macos:
    runs-on: macos-latest # Apple Silicon，与 desktop/package.json 的 dmg arm64 目标一致
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          # macOS 必须 3.13（与本地打包一致）：3.11 打出的 mac 包在部分机器上
          # WSS 长连接会被对端莫名 FIN（实时识别断流），3.13 本地包实测稳定。
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Nuitka 编译缓存（macOS 路径），二次构建大幅提速
      - name: Cache Nuitka build cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Nuitka
          key: nuitka-${{ runner.os }}-py3.13-${{ hashFiles('backend/requirements.txt', 'scripts/build-backend-nuitka.sh') }}
          restore-keys: |
            nuitka-${{ runner.os }}-py3.13-
            nuitka-${{ runner.os }}-

      # 缓存Python虚拟环境，加速依赖安装
      - name: Cache Python virtualenv
        uses: actions/cache@v4
        with:
          path: env
          key: venv-${{ runner.os }}-py3.13-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            venv-${{ runner.os }}-py3.13-
            venv-${{ runner.os }}-

      # build-macos.sh 会自建 env 虚拟环境、生成 icns 图标，并产出 dmg + zip
      - name: Run macOS build script
        run: ./scripts/build-macos.sh

      # dmg 安装镜像 + zip（自动更新通道用）+ latest-mac.yml
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
          if-no-files-found: error
          retention-days: 14

  # 仅在推送 v* 标签时运行：把可用的平台产物挂到 GitHub Release 上。
  # .yml/.blockmap 一并上传，electron-updater 的 GitHub 通道需要它们。
  #
  # 不再要求 macOS 构建成功才发布：macOS runner 会因容量问题长时间拿不到
  # （"The job was not acquired by Runner of type hosted even after multiple
  # attempts"），此前因此 1.4.4–1.4.6 一个 Release 都没发出。
  # - Windows 成功即可先发；macOS 产物缺失时标成 pre-release（应用内更新
  #   读的是 latest，不会把 Mac 用户引到一个没有 dmg 的版本）。
  # - 之后重跑 macOS 任务时，发布任务会幂等补传 dmg 并去掉 pre-release。
  publish-release:
    needs: [build-windows, build-macos]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist/win

      - name: Download macOS artifacts (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: dist/mac

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          TAG="$GITHUB_REF_NAME"
          REPO="${{ github.repository }}"
          mac=(dist/mac/*)
          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            if [ ${#mac[@]} -eq 0 ]; then
              echo "macOS artifacts missing; publishing Windows-only pre-release"
              gh release create "$TAG" -R "$REPO" --title "$TAG" --generate-notes --prerelease
            else
              gh release create "$TAG" -R "$REPO" --title "$TAG" --generate-notes
            fi
          fi
          gh release upload "$TAG" dist/win/* -R "$REPO" --clobber
          if [ ${#mac[@]} -gt 0 ]; then
            gh release upload "$TAG" "${mac[@]}" -R "$REPO" --clobber
            gh release edit "$TAG" -R "$REPO" --prerelease=false
          fi
